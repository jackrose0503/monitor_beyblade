name: Funbox Beyblade Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: Reset baseline without sending notifications
        required: false
        default: false
        type: boolean
      send_status_report:
        description: Send the current beyblade category status to Telegram and email
        required: false
        default: false
        type: boolean
      sync_store_catalog:
        description: Refresh config/store_subscriptions.json from the latest store inventory data
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: funbox-beyblade-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python3 -m playwright install --with-deps chromium

      - name: Harden monitor runtime for slow Funbox page loads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/funbox_beyblade_monitor.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "items = page.locator('a[href*=\"/products/\"]').evaluate_all(\n        \"\"\"":
              "items = page.locator('a[href*=\"/products/\"]').evaluate_all(\n        r\"\"\"",
              "payload = page.evaluate(\n        \"\"\"":
              "payload = page.evaluate(\n        r\"\"\"",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_navigation = '''def _goto_page_with_ready_dom(page: object, url: str) -> None:
              last_error: Exception | None = None
              for wait_until in ("domcontentloaded", "load"):
                  try:
                      page.goto(url, wait_until=wait_until, timeout=DEFAULT_TIMEOUT_SECONDS * 1000)
                      return
                  except Exception as exc:
                      last_error = exc
              if last_error is not None:
                  raise last_error
          '''
          new_navigation = '''def _goto_page_with_ready_dom(page: object, url: str) -> None:
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=DEFAULT_TIMEOUT_SECONDS * 1000)
                  return
              except Exception as exc:
                  if _page_has_loaded_content(page):
                      return
                  raise exc


          def _page_has_loaded_content(page: object) -> bool:
              try:
                  content = page.content()
              except Exception:
                  return False
              normalized = content.strip().lower()
              return "<body" in normalized or "/products/" in normalized or "線上庫存" in content
          '''
          if old_navigation in text:
              text = text.replace(old_navigation, new_navigation)

          category_function_pattern = re.compile(
              r"def _fetch_category_products_with_page\(page: object, category_url: str\) -> list\[CategoryProduct\]:.*?(?=\n\ndef fetch_product_detail_with_page)",
              re.S,
          )
          hardened_category_function = '''def _fetch_category_products_with_page(page: object, category_url: str) -> list[CategoryProduct]:
              _goto_page_with_ready_dom(page, category_url)
              _wait_for_category_product_links(page)
              items = page.locator('a[href*="/products/"]').evaluate_all(
                  r"""
                  (nodes) => {
                    const seen = new Map();
                    for (const node of nodes) {
                      const href = new URL(node.getAttribute('href'), window.location.origin).toString();
                      const card = node.closest('[class*="product"], [data-product-id], [data-id], li, .thumbnail') || node.parentElement || node;
                      const candidates = [
                        node.getAttribute('title'),
                        node.textContent,
                        node.querySelector('img')?.getAttribute('alt'),
                        card.textContent,
                      ]
                        .map((value) => (value || '').replace(/\\s+/g, ' ').trim())
                        .filter(Boolean);
                      const name = candidates.sort((a, b) => b.length - a.length)[0] || href.split('/').pop();
                      const stockText = (card.textContent || '').replace(/\\s+/g, ' ').trim();
                      const dataset = Object.assign({}, card.dataset || {}, node.dataset || {});
                      const catalogId = Object.values(dataset).find((value) => /^\\d+$/.test(String(value || ''))) || '';
                      if (!seen.has(href) || seen.get(href).name.length < name.length) {
                        let stockStatus = 'unknown';
                        if (/商品已售完|售完待補貨|庫存不足|已售完|缺貨/.test(stockText)) {
                          stockStatus = 'sold_out';
                        } else if (/加入購物車|尚有庫存|可購買/.test(stockText)) {
                          stockStatus = 'in_stock';
                        }
                        seen.set(href, { product_url: href, catalog_id: String(catalogId), name, stock_status: stockStatus });
                      }
                    }
                    return Array.from(seen.values());
                  }
                  """
              )
              html = page.content()

              products = [CategoryProduct(**item) for item in items]
              catalog_ids = _extract_catalog_ids_from_category_html(html)
              if products and catalog_ids:
                  missing_ids = all(not product.catalog_id for product in products)
                  if missing_ids and len(catalog_ids) >= len(products):
                      products = [
                          replace(product, catalog_id=catalog_ids[index])
                          for index, product in enumerate(products)
                      ]
              return products


          def _wait_for_category_product_links(page: object) -> None:
              selector = 'a[href*="/products/"]'
              for attempt in range(5):
                  try:
                      if page.locator(selector).count() > 0:
                          return
                  except Exception:
                      pass
                  try:
                      page.wait_for_selector(selector, timeout=5_000)
                      return
                  except Exception:
                      pass
                  try:
                      page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                  except Exception:
                      pass
                  page.wait_for_timeout(1_000 + attempt * 500)
          '''
          text, replacements_count = category_function_pattern.subn(
              lambda _match: hardened_category_function,
              text,
              count=1,
          )
          if replacements_count != 1:
              raise SystemExit("Category function patch target not found")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare monitor-state worktree
        run: |
          set -euo pipefail
          rm -rf monitor-state-worktree
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch --depth=1 origin monitor-state
            git worktree add --detach monitor-state-worktree FETCH_HEAD
          else
            git worktree add --detach monitor-state-worktree HEAD
            (
              cd monitor-state-worktree
              git checkout --orphan monitor-state
              git rm -rf . >/dev/null 2>&1 || true
              find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            )
          fi
          mkdir -p monitor-state-worktree/state

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESET_BASELINE: ${{ github.event.inputs.reset_baseline || 'false' }}
          SEND_STATUS_REPORT: ${{ github.event.inputs.send_status_report || 'false' }}
          SYNC_STORE_CATALOG: ${{ github.event.inputs.sync_store_catalog || 'false' }}
        run: |
          set -euo pipefail
          if [ "${SYNC_STORE_CATALOG}" = "true" ]; then
            python3 scripts/funbox_beyblade_monitor.py \
              --sync-store-catalog \
              --store-subscriptions-file config/store_subscriptions.json
          elif [ "${SEND_STATUS_REPORT}" = "true" ]; then
            python3 scripts/funbox_beyblade_monitor.py --send-status-report
          elif [ "${RESET_BASELINE}" = "true" ]; then
            python3 scripts/funbox_beyblade_monitor.py \
              --state-file monitor-state-worktree/state/funbox-beyblade.json \
              --reset-baseline
          else
            python3 scripts/funbox_beyblade_monitor.py \
              --state-file monitor-state-worktree/state/funbox-beyblade.json
          fi

      - name: Commit updated store subscriptions
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_store_catalog == 'true' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add config/store_subscriptions.json
          if git diff --cached --quiet; then
            echo "No store subscription changes to commit."
            exit 0
          fi
          git commit -m "chore: sync store subscriptions"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Commit updated state
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.sync_store_catalog == 'true') }}
        run: |
          set -euo pipefail
          cd monitor-state-worktree
          git add state/funbox-beyblade.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update Beyblade monitor state"
          git push origin HEAD:monitor-state
